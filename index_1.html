<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasaporte de Inglés</title>
<style>
  :root{
    --paper:#FAF6EC;
    --paper-dark:#F0E8D4;
    --ink:#202A3C;
    --ink-soft:#5B6478;
    --stamp-red:#BD432B;
    --stamp-gold:#A67425;
    --stamp-green:#2F6B4F;
    --line:#D9CDB0;
    --error:#B23A2F;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
  }
  h1,h2,h3,.serif{ font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; }
  #app{ max-width:880px; margin:0 auto; padding:28px 18px 60px; }

  .topbar{ text-align:center; margin-bottom:22px; }
  .topbar .eyebrow{ letter-spacing:.18em; text-transform:uppercase; font-size:11px; color:var(--ink-soft); }
  .topbar h1{ font-size:30px; margin:4px 0 2px; }
  .topbar p{ color:var(--ink-soft); margin:0; font-size:14px; }

  .progress-wrap{ margin:18px 0 26px; }
  .progress-bar{ background:var(--paper-dark); border:1px solid var(--line); border-radius:20px; height:14px; overflow:hidden; }
  .progress-fill{ background:linear-gradient(90deg,var(--stamp-gold),var(--stamp-red)); height:100%; transition:width .4s ease; }
  .progress-label{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-top:6px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 14px; position:relative; cursor:pointer; transition:transform .15s, box-shadow .15s;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .card:hover{ transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.08); }
  .card.locked{ cursor:not-allowed; opacity:.55; filter:grayscale(.4); }
  .card:hover.locked{ transform:none; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .stamp{
    width:54px; height:54px; border-radius:50%; border:2px dashed var(--stamp-red);
    display:flex; align-items:center; justify-content:center; font-size:24px;
    transform:rotate(-8deg); margin-bottom:10px; color:var(--stamp-red);
  }
  .card.done .stamp{ border-style:solid; border-color:var(--stamp-green); color:var(--stamp-green); background:#f2f8f5; }
  .card .unit-no{ font-size:11px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; }
  .card h3{ margin:4px 0 6px; font-size:17px; }
  .card .status{ font-size:12px; color:var(--ink-soft); }
  .card .status.done{ color:var(--stamp-green); font-weight:600; }
  .lock-icon{ position:absolute; top:14px; right:14px; font-size:16px; }

  .btn{
    font-family:inherit; border:1px solid var(--ink); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:30px; cursor:pointer; font-size:14px; font-weight:600;
  }
  .btn:hover{ opacity:.88; }
  .btn.secondary{ background:transparent; color:var(--ink); }
  .btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--ink-soft); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }

  .unit-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
  .unit-header h2{ margin:0; font-size:24px; }
  .back-link{ color:var(--ink-soft); cursor:pointer; font-size:13px; text-decoration:underline; }

  .tabs{ display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:20px; flex-wrap:wrap; }
  .tab{ padding:10px 14px; font-size:13px; cursor:pointer; color:var(--ink-soft); border-bottom:3px solid transparent; font-weight:600; }
  .tab.active{ color:var(--ink); border-bottom-color:var(--stamp-red); }

  .panel{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px; }

  .rule{ margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--paper-dark); }
  .rule:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .rule h4{ margin:0 0 8px; font-size:15px; }
  .example{ background:var(--paper-dark); border-radius:8px; padding:8px 12px; margin-top:6px; font-size:14px; }
  .example .en{ font-weight:600; }
  .example .es{ color:var(--ink-soft); font-size:13px; }

  .vocab-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--paper-dark); }
  .vocab-row:last-child{ border-bottom:none; }
  .vocab-en{ font-weight:600; }
  .vocab-es{ color:var(--ink-soft); font-size:13px; }
  .speak-btn{ border:1px solid var(--line); background:var(--paper-dark); border-radius:50%; width:34px; height:34px; cursor:pointer; font-size:15px; }
  .speak-btn:hover{ background:var(--line); }

  .bubble{ max-width:75%; padding:10px 14px; border-radius:14px; margin-bottom:10px; font-size:14px; }
  .bubble.A{ background:var(--paper-dark); margin-right:auto; border-bottom-left-radius:2px; }
  .bubble.B{ background:#FDEFE9; margin-left:auto; border-bottom-right-radius:2px; text-align:right; }
  .bubble .es{ color:var(--ink-soft); font-size:12px; margin-top:3px; }

  .practice-card{ border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  .practice-phrase{ font-size:16px; font-weight:600; }
  .practice-es{ color:var(--ink-soft); font-size:13px; margin-bottom:10px; }
  .mic-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .result-box{ margin-top:8px; font-size:13px; padding:8px 10px; border-radius:8px; display:none; }
  .result-box.ok{ background:#EAF5EF; color:var(--stamp-green); display:block; }
  .result-box.bad{ background:#FBEAE7; color:var(--error); display:block; }
  .diffword{ font-weight:600; }
  .diffword.ok{ color:var(--stamp-green); }
  .diffword.bad{ color:var(--error); text-decoration:underline wavy; }

  .review-card{ text-align:center; padding:50px 20px; }
  .review-word{ font-size:30px; font-weight:700; margin-bottom:8px; }
  .review-translation{ font-size:18px; color:var(--ink-soft); min-height:26px; margin-bottom:18px; }
  .review-progress{ font-size:12px; color:var(--ink-soft); margin-bottom:16px; }
  .review-done{ text-align:center; padding:40px 20px; }

  .q-block{ margin-bottom:20px; }
  .q-text{ font-weight:600; margin-bottom:8px; }
  .opt{ display:block; padding:9px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; cursor:pointer; font-size:14px; }
  .opt:hover{ background:var(--paper-dark); }
  .opt.selected{ border-color:var(--ink); background:var(--paper-dark); }
  .opt.correct{ border-color:var(--stamp-green); background:#EAF5EF; }
  .opt.incorrect{ border-color:var(--error); background:#FBEAE7; }
  .opt input{ margin-right:8px; }

  .score-banner{ text-align:center; padding:16px; border-radius:10px; margin-bottom:18px; font-weight:600; }
  .score-banner.pass{ background:#EAF5EF; color:var(--stamp-green); }
  .score-banner.fail{ background:#FBEAE7; color:var(--error); }

  .footnote{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:30px; }
  .footnote span{ text-decoration:underline; cursor:pointer; }
</style>
</head>
<body>
<div id="app">Cargando…</div>

{
  id:25, icon:"🗣️", title:"Opiniones y Debates",
  grammar:{
    title:"Expresar y defender opiniones en inglés",
    rules:[
      {rule:"Para dar una opinión: In my opinion... / I think (that)... / I believe (that)... / As far as I'm concerned...",
       examples:[{en:"In my opinion, learning English is essential today.",es:"En mi opinión, aprender inglés es esencial hoy en día."},{en:"As far as I'm concerned, the best way to learn is to practice every day.",es:"En lo que a mí respecta, la mejor manera de aprender es practicar todos los días."}]},
      {rule:"Para estar de acuerdo: I agree (with you). / Exactly. / That's a good point. / You're absolutely right.",
       examples:[{en:"I completely agree with your point.",es:"Estoy completamente de acuerdo con tu punto."}]},
      {rule:"Para estar en desacuerdo con cortesía: I see your point, but... / I'm not sure I agree... / On the other hand... / Actually, I think...",
       examples:[{en:"I see your point, but I think there are other factors to consider.",es:"Entiendo tu punto, pero creo que hay otros factores a considerar."}]},
      {rule:"Para hacer énfasis y contraargumentar: Despite this... / Even so... / Nevertheless... / The fact is that...",
       examples:[{en:"Despite this, I still believe the benefits outweigh the risks.",es:"A pesar de esto, sigo creyendo que los beneficios superan los riesgos."}]}
    ]
  },
  vocab:[
    {en:"In my opinion",es:"En mi opinión"},{en:"I believe",es:"Creo / Considero"},{en:"As far as I'm concerned",es:"En lo que a mí respecta"},
    {en:"I agree",es:"Estoy de acuerdo"},{en:"I disagree",es:"No estoy de acuerdo"},{en:"That's a good point",es:"Es un buen punto"},
    {en:"On the other hand",es:"Por otro lado"},{en:"Despite this",es:"A pesar de esto"},{en:"Nevertheless",es:"Sin embargo / No obstante"},
    {en:"The fact is that",es:"El hecho es que"},{en:"It depends on",es:"Depende de"},{en:"To some extent",es:"Hasta cierto punto"},
    {en:"I'd rather",es:"Preferiría"},{en:"Outweigh",es:"Superar / Pesar más que"},{en:"Benefit",es:"Beneficio"},{en:"Drawback",es:"Desventaja"}
  ],
  dialogue:[
    {sp:"A",en:"Do you think social media has more benefits or drawbacks?",es:"¿Crees que las redes sociales tienen más beneficios o desventajas?"},
    {sp:"B",en:"In my opinion, the drawbacks outweigh the benefits. It wastes too much time.",es:"En mi opinión, las desventajas superan los beneficios. Desperdicia demasiado tiempo."},
    {sp:"A",en:"I see your point, but on the other hand, it helps people stay connected.",es:"Entiendo tu punto, pero por otro lado, ayuda a la gente a mantenerse conectada."},
    {sp:"B",en:"That's true to some extent. Nevertheless, I believe face-to-face contact is more valuable.",es:"Eso es cierto hasta cierto punto. No obstante, creo que el contacto cara a cara es más valioso."},
    {sp:"A",en:"I completely agree with that. As far as I'm concerned, balance is key.",es:"Estoy completamente de acuerdo con eso. En lo que a mí respecta, el equilibrio es clave."},
    {sp:"B",en:"Exactly. The fact is that technology itself isn't the problem — it's how we use it.",es:"Exactamente. El hecho es que la tecnología en sí no es el problema, sino cómo la usamos."},
    {sp:"A",en:"That's a really good point. It depends on the individual, I think.",es:"Ese es un punto muy bueno. Creo que depende del individuo."},

  practice:[

  quiz:[

    {q:"Traduce \"En mi opinión\":",opts:["I believe","In my opinion","As far as I know","I think so"],correct:1,explain:"\"In my opinion\" = en mi opinión."},

    {q:"\"The benefits ___ the risks.\" (superar)",opts:["outweigh","overcome","overlap","overrun"],correct:0,explain:"\"outweigh\" = superar en peso/importancia."},
    {q:"Traduce \"Sin embargo / No obstante\" (formal):",opts:["Despite","Although","Nevertheless","Unless"],correct:2,explain:"\"nevertheless\" = sin embargo (más formal)."},
    {q:"\"___ I'm concerned, this is the best option.\"",opts:["As far as","As long as","As much as","As well as"],correct:0,explain:"\"As far as I'm concerned\" = en lo que a mí respecta."},
    {q:"Traduce \"Hasta cierto punto\":",opts:["On the other hand","To some extent","The fact is","Despite this"],correct:1,explain:"\"to some extent\" = hasta cierto punto."},

    {q:"What do both speakers agree on?",opts:["Social media is bad","Face-to-face contact is valuable","Technology is the problem","Balance is key"],correct:3,explain:"A dice: \"balance is key\" y B está de acuerdo."}

  story:{text:"A school is debating whether students should wear uniforms. One student, Tom, argues in favour. In his opinion, uniforms reduce inequality and help students focus on learning rather than fashion. However, his classmate Ana disagrees. As far as she is concerned, uniforms restrict personal expression. She believes students should be free to show their personality. Tom sees her point, but argues that the benefits outweigh the drawbacks. The teacher says both arguments have merit and encourages the class to think critically. In the end, the class votes — and it's a tie.",questions:[{q:"What is Tom's main argument for uniforms?",opts:["They look nice", "They reduce inequality and help focus", "They save money", "They are more comfortable"],correct:1,explain:"Tom says uniforms reduce inequality and help students focus."},
      {q:"What is Ana's main concern?",opts:["Uniforms are expensive", "Uniforms restrict personal expression", "Uniforms are uncomfortable", "Uniforms cause problems"],correct:1,explain:"Ana believes uniforms restrict personal expression."},

  errors:[{wrong:"In my opinion, I think this is wrong.",right:"In my opinion, this is wrong. / I think this is wrong.",explain:"'In my opinion' y 'I think' significan lo mismo. Usar los dos juntos es redundante."},
    {wrong:"I'm agree with you.",right:"I agree with you.",explain:"'Agree' es un verbo, no un adjetivo. No se usa 'be + agree': solo 'I agree'."},
    {wrong:"Despite of the problems, it works.",right:"Despite the problems, it works.",explain:"'Despite' NO lleva 'of'. 'Despite + sustantivo'. 'In spite OF' sí lleva 'of'."}]

{
  id:27, icon:"🎭", title:"Wish, If Only y el Subjuntivo",
  grammar:{
    title:"Deseos, arrepentimientos y el subjuntivo en sugerencias",
    rules:[
      {rule:"\"Wish\" + pasado simple: para desear que algo del presente fuera diferente (situación irreal).",
       examples:[{en:"I wish I had more time.",es:"Ojalá tuviera más tiempo."},{en:"I wish it weren't raining.",es:"Ojalá no estuviera lloviendo."}]},
      {rule:"\"Wish\" + past perfect (had + participio): para lamentar algo del pasado que ya no se puede cambiar.",
       examples:[{en:"I wish I had studied harder.",es:"Ojalá hubiera estudiado más."},{en:"She wishes she hadn't said that.",es:"Ella desearía no haber dicho eso."}]},
      {rule:"\"Wish\" + would: para quejarse de un comportamiento molesto que no cambia (no se usa con uno mismo).",
       examples:[{en:"I wish you would stop interrupting me.",es:"Ojalá dejaras de interrumpirme."},{en:"I wish he would call more often.",es:"Ojalá él llamara más seguido."}]},
      {rule:"\"If only\" funciona como \"wish\" pero con más énfasis emocional.",
       examples:[{en:"If only I had more patience!",es:"¡Si tan solo tuviera más paciencia!"},{en:"If only I hadn't lost my passport.",es:"Si tan solo no hubiera perdido mi pasaporte."}]},
      {rule:"Subjuntivo tras verbos de sugerencia/orden (suggest, recommend, insist, demand, require) + that + verbo base (sin -s, sin \"to\", igual para todas las personas).",
       examples:[{en:"The doctor recommends that she rest.",es:"El médico recomienda que ella descanse."},{en:"It is essential that everyone be on time.",es:"Es esencial que todos sean puntuales."}]},
      {rule:"\"Hope\" (algo posible en el futuro) es distinto de \"wish\" (algo irreal o poco probable).",
       examples:[{en:"I hope you pass the exam.",es:"Espero que apruebes el examen. (posible)"},{en:"I wish I could speak Japanese.",es:"Ojalá pudiera hablar japonés. (irreal)"}]}
    ]
  },
  vocab:[
    {en:"To wish",es:"Desear / ojalá"},{en:"To regret",es:"Arrepentirse"},{en:"Regret",es:"Arrepentimiento"},
    {en:"If only",es:"Si tan solo"},{en:"To hope",es:"Esperar (que algo pase)"},{en:"To insist",es:"Insistir"},
    {en:"To recommend",es:"Recomendar"},{en:"To suggest",es:"Sugerir"},{en:"Essential",es:"Esencial"},
    {en:"Crucial",es:"Crucial"},{en:"Hypothetical",es:"Hipotético"},{en:"Unrealistic",es:"Poco realista"},
    {en:"To long for",es:"Anhelar"},{en:"Longing",es:"Anhelo"},{en:"To daydream",es:"Fantasear (despierto)"},
    {en:"Mandatory",es:"Obligatorio"},{en:"Behaviour",es:"Comportamiento"},{en:"To annoy",es:"Molestar / fastidiar"}
  ],
  dialogue:[

    {sp:"A",en:"That sounds like good advice. If only more people spoke up like that.",es:"Suena como buen consejo. Si tan solo más gente se expresara así."},

  quiz:[

    {q:"\"I wish I ___ harder for the exam.\" (ya pasó)",opts:["studied","study","had studied","would study"],correct:2,explain:"Para lamentar el pasado se usa \"wish\" + past perfect."},
    {q:"\"I wish you ___ stop making that noise!\"",opts:["would","will","are","did"],correct:0,explain:"\"Wish + would\" se usa para quejarse de un comportamiento molesto."},
    {q:"\"It is essential that he ___ present at the meeting.\"",opts:["is","be","was","being"],correct:1,explain:"Subjuntivo: verbo base sin conjugar, sin importar la persona."},
    {q:"Elige la opción correcta:",opts:["I hope I could fly.","I wish I could fly.","I wish I can fly.","I hope I can flying."],correct:1,explain:"Para algo irreal (volar) se usa \"wish\", no \"hope\"."},

    {q:"Diferencia entre hope y wish:",opts:["Son idénticos","Hope = posible, Wish = irreal o poco probable","Wish = posible, Hope = irreal","Hope solo se usa en pasado"],correct:1,explain:"\"Hope\" se usa para algo que puede pasar; \"wish\" para algo irreal o poco probable."}
  ],
  listening:[

{

  grammar:{
    title:"Inversión con adverbios negativos y oraciones hendidas (cleft sentences)",
    rules:[
      {rule:"Inversión tras adverbios negativos o restrictivos al inicio de la oración (Never, Rarely, Seldom, Little): se invierte el sujeto y el auxiliar, como en una pregunta.",
       examples:[{en:"Never have I seen such a mess.",es:"Nunca he visto tal desorden."},{en:"Rarely does he complain.",es:"Rara vez se queja."}]},
      {rule:"\"Not only... but also\" con inversión en la primera cláusula para dar énfasis.",
       examples:[{en:"Not only did she win the race, but she also broke the record.",es:"No solo ganó la carrera, sino que también rompió el récord."}]},
      {rule:"\"No sooner... than\" y \"Hardly... when\" describen dos acciones consecutivas, con inversión en la primera cláusula.",
       examples:[{en:"No sooner had I sat down than the phone rang.",es:"Apenas me había sentado cuando sonó el teléfono."},{en:"Hardly had we started when it began to rain.",es:"Apenas habíamos empezado cuando comenzó a llover."}]},
      {rule:"Oraciones hendidas con \"It is/was... that/who\" para enfatizar un elemento específico de la oración.",
       examples:[{en:"It was Maria who found the keys.",es:"Fue María quien encontró las llaves."},{en:"It was on Friday that they announced the news.",es:"Fue el viernes cuando anunciaron la noticia."}]},
      {rule:"Oraciones hendidas con \"What\" para enfatizar una acción, idea o necesidad.",

{
  id:29, icon:"🔨", title:"Verbos Causativos y Condicionales Mixtos",
  grammar:{
    title:"Have/get something done, have/get someone do something y condicionales mixtos",
    rules:[
      {rule:"\"Have something done\": para decir que otra persona hace algo por ti (servicio). Estructura: have/get + objeto + participio pasado.",
       examples:[{en:"I had my hair cut yesterday.",es:"Me corté el pelo (me lo cortaron) ayer."},{en:"We're getting our car repaired.",es:"Nos están reparando el auto."}]},
      {rule:"\"Have someone do something\": pides a alguien que haga algo directamente (infinitivo sin \"to\").",
       examples:[{en:"I had my brother fix the computer.",es:"Hice que mi hermano arreglara la computadora."},{en:"She had the assistant send the emails.",es:"Ella hizo que el asistente enviara los correos."}]},
      {rule:"\"Get someone to do something\": implica persuasión o convencer a alguien (con \"to\" + infinitivo).",
       examples:[{en:"I got him to help me move the sofa.",es:"Logré que me ayudara a mover el sofá."},{en:"She got her son to clean his room.",es:"Ella logró que su hijo limpiara su cuarto."}]},
      {rule:"Condicional mixto tipo A: condición del pasado (if + past perfect) + resultado en el presente (would + infinitivo).",
       examples:[{en:"If I had studied medicine, I would be a doctor now.",es:"Si hubiera estudiado medicina, ahora sería médico."},{en:"If she had taken that job, she would live in Paris now.",es:"Si hubiera tomado ese trabajo, ahora viviría en París."}]},
      {rule:"Condicional mixto tipo B: condición general/presente (if + past simple) + resultado en el pasado (would have + participio).",

       examples:[{en:"He must be tired after that trip.",es:"Debe estar cansado después de ese viaje."},{en:"That can't be true.",es:"Eso no puede ser verdad."}]},
      {rule:"Deducción sobre el pasado: must have / might have / could have / can't have + participio pasado.",
       examples:[{en:"He must have forgotten the meeting.",es:"Debe haberse olvidado de la reunión."},{en:"She can't have left already, her car is still here.",es:"No puede haberse ido ya, su auto sigue aquí."}]},

      {rule:"\"Should have / shouldn't have\" + participio para criticar o lamentar una acción pasada.",

{
  id:31, icon:"🧵", title:"Cláusulas de Participio",
  grammar:{
    title:"Participle clauses: combinando oraciones de forma fluida y formal",
    rules:[
      {rule:"Participio presente (-ing) reemplaza una cláusula de tiempo/causa cuando el sujeto es el mismo en ambas partes.",
       examples:[{en:"Walking home, I saw an old friend.",es:"Caminando a casa, vi a un viejo amigo. (= While I was walking home...)"},{en:"Feeling tired, she decided to go to bed early.",es:"Sintiéndose cansada, decidió irse a dormir temprano."}]},
      {rule:"Participio pasado (-ed / participio irregular) con sentido pasivo, para reemplazar una cláusula relativa pasiva.",
       examples:[{en:"Written in 1990, the book became a classic.",es:"Escrito en 1990, el libro se convirtió en un clásico. (= The book, which was written in 1990...)"},{en:"Confused by the instructions, he called for help.",es:"Confundido por las instrucciones, llamó pidiendo ayuda."}]},
      {rule:"\"Having + participio\" indica que una acción se completó antes que otra.",
       examples:[{en:"Having finished his homework, he went out to play.",es:"Habiendo terminado su tarea, salió a jugar."},{en:"Having lived in France for years, she speaks fluent French.",es:"Habiendo vivido en Francia por años, habla francés con fluidez."}]},
      {rule:"Estas cláusulas son comunes en escritura formal y narrativa; hacen el texto más conciso y evitan repetir el sujeto.",
       examples:[{en:"Not knowing what to say, he stayed silent.",es:"Sin saber qué decir, se quedó callado."}]}

    {q:"¿Cuál es la versión más formal y concisa?",opts:["Because she had studied hard, she passed the exam easily.","Having studied hard, she passed the exam easily.","She studied hard so she passed the exam easily.","She had studied hard, so exam passed."],correct:1,explain:"Las cláusulas de participio son más concisas y típicas de un registro formal."},

{
  id:32, icon:"🎓", title:"Conectores Académicos y Lenguaje Formal",
  grammar:{
    title:"Conectores de contraste, concesión, condición y causa en registro formal",
    rules:[
      {rule:"Contraste formal: however, nevertheless, whereas, while (al inicio o entre cláusulas, con coma).",
       examples:[{en:"The report was thorough. However, it lacked recent data.",es:"El informe fue exhaustivo. Sin embargo, le faltaban datos recientes."},{en:"Sales increased in Europe, whereas they declined in Asia.",es:"Las ventas aumentaron en Europa, mientras que disminuyeron en Asia."}]},
      {rule:"Concesión: despite/in spite of + sustantivo o gerundio; although/even though + cláusula completa.",
       examples:[{en:"Despite the rain, the event was a success.",es:"A pesar de la lluvia, el evento fue un éxito."},{en:"Although it was raining, the event was a success.",es:"Aunque estaba lloviendo, el evento fue un éxito."}]},
      {rule:"Condición formal: provided that, as long as (con tal de que), unless (a menos que), given that (dado que).",
       examples:[{en:"You may proceed, provided that all documents are signed.",es:"Puede proceder, siempre que todos los documentos estén firmados."},{en:"Given that the budget is limited, we must prioritize.",es:"Dado que el presupuesto es limitado, debemos priorizar."}]},
      {rule:"Causa/efecto formal: due to / owing to + sustantivo; as a result, consequently, therefore, thus + cláusula.",
       examples:[{en:"The flight was delayed due to bad weather.",es:"El vuelo se retrasó debido al mal clima."},{en:"The results were disappointing; consequently, the plan was revised.",es:"Los resultados fueron decepcionantes; en consecuencia, el plan fue revisado."}]}
    ]
  },
  vocab:[
    {en:"Contrast",es:"Contraste"},{en:"Concession",es:"Concesión"},{en:"Notwithstanding",es:"No obstante"},
    {en:"Albeit",es:"Aunque / si bien"},{en:"Hence",es:"Por lo tanto"},{en:"Thereby",es:"De ese modo"},
    {en:"In light of",es:"A la luz de / considerando"},{en:"With regard to",es:"Con respecto a"},{en:"Henceforth",es:"De ahora en adelante"},
    {en:"Moreover",es:"Además"},{en:"Furthermore",es:"Asimismo"},{en:"Nonetheless",es:"No obstante"},
    {en:"To prioritize",es:"Priorizar"},{en:"Budget",es:"Presupuesto"},{en:"To proceed",es:"Proceder"},
    {en:"Outcome",es:"Resultado"},{en:"Overall",es:"En general"},{en:"Accordingly",es:"En consecuencia"}

  dialogue:[
    {sp:"A",en:"How did the quarterly review go?",es:"¿Cómo salió la revisión trimestral?"},

    {q:"\"Costs are rising; ___, we need to cut expenses.\"",opts:["whereas","therefore","although","despite"],correct:1,explain:"\"Therefore\" indica una consecuencia lógica."},
    {q:"\"Profits rose in Asia, ___ they fell in Europe.\"",opts:["whereas","therefore","due to","unless"],correct:0,explain:"\"Whereas\" contrasta dos situaciones diferentes."},

  story:{text:"The city council debated the new park project for months. Despite strong public support, some council members worried about the cost. Given that the city budget was limited, they considered several funding options. Provided that a private sponsor could be found, the project would move forward without raising taxes. Nevertheless, finding a sponsor proved difficult. After further discussion, the council decided to proceed with a smaller version of the park. Consequently, the new design included fewer facilities but kept the main features that residents wanted most. Overall, most citizens were satisfied with the compromise.",questions:[{q:"What worried some council members?",opts:["The location", "The cost", "The size", "The design"],correct:1,explain:"Some council members worried about the cost."},
      {q:"What condition would allow the project to move forward without raising taxes?",opts:["Finding a private sponsor", "Reducing the park size", "Raising taxes", "Cancelling the project"],correct:0,explain:"Provided that a private sponsor could be found, the project would move forward."},
      {q:"What did the council finally decide?",opts:["To cancel the project", "To proceed with a smaller version", "To raise taxes", "To wait another year"],correct:1,explain:"The council decided to proceed with a smaller version of the park."}]},

    {prompt:"You want to explain a cause formally, followed by a noun phrase.",options:["The delay was due to a technical issue.", "The delay was due to it was a technical issue.", "The delay was despite a technical issue."],correct:0,feedback:"'Due to' is followed by a noun phrase, not a full clause."}],
  errors:[{wrong:"Despite he was tired, he finished the report.",right:"Despite being tired, he finished the report.",explain:"\"Despite\" va seguido de sustantivo o gerundio, no de una cláusula completa con sujeto y verbo."},
    {wrong:"The meeting was cancelled due to it was raining.",right:"The meeting was cancelled due to the rain.",explain:"\"Due to\" necesita un sustantivo después, no una cláusula completa."},
    {wrong:"He is talented, however he is lazy.",right:"He is talented; however, he is lazy.",explain:"\"However\" entre dos cláusulas completas necesita punto y coma o punto, y coma después."}]

  story:{text:"When Nadia became the new director, she knew the company needed to embark on major changes. Several long-term employees raised concerns about losing their roles. Nadia understood their worries, but she refused to dwell on the difficulties of the past. Instead, she focused on the future. She asked her team to comply with a new, more efficient process and to cope with the initial confusion together. After six months, the team reached an agreement on a plan that satisfied everyone. The changes brought about a stronger, more motivated department, and Nadia felt proud that they had achieved their main goal: keeping the team united during a difficult transition.",questions:[{q:"What did Nadia want the company to do?",opts:["Stay the same", "Embark on major changes", "Reduce staff", "Move offices"],correct:1,explain:"She knew the company needed to embark on major changes."},

  story:{text:"As a manager, Priya always tries to give feedback diplomatically. When a team member's report seemed unclear, she didn't say it was bad. Instead, she said, \"This is a solid start; it might just benefit from a clearer introduction.\" When a colleague's idea seemed unrealistic, she said, \"It could be argued that this approach is a bit ambitious for our current budget,\" rather than rejecting it outright. Her team appreciates that she tends to soften criticism while still being honest. \"Perhaps we could explore other options too,\" she often says, leaving room for discussion. Because of her tactful style, people feel comfortable sharing ideas, even when those ideas need improvement.",questions:[{q:"How does Priya usually give feedback?",opts:["Bluntly and directly", "Diplomatically, softening criticism", "She avoids giving feedback", "Only in writing"],correct:1,explain:"Priya always tries to give feedback diplomatically."},

/* ============== ESTADO Y PERSISTENCIA ============== */
let progress = {};   // {1:{completed:true,score:80}, ...}
let lastUnit = null;
let state = { view:"dashboard", unitId:null, tab:"grammar" };
let recognition = null;

function loadProgress(){
  try{
    const raw = localStorage.getItem("pasaporte_progress");
    progress = raw ? JSON.parse(raw) : {};
  }catch(e){ progress = {}; }
  render();
}
function saveProgress(){
  try{ localStorage.setItem("pasaporte_progress", JSON.stringify(progress)); }catch(e){}
}
function resetProgress(){
  if(!confirm("¿Borrar todo el progreso guardado? Esta acción no se puede deshacer.")) return;
  progress = {};
  try{ localStorage.removeItem("pasaporte_progress"); }catch(e){}
  state.view = "dashboard";
  render();
}

function exportProgress(){
  const blob = new Blob([JSON.stringify(progress,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "progreso-ingles-ian.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importProgress(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = JSON.parse(e.target.result);
      progress = data;
      saveProgress();
      alert("Progreso restaurado correctamente.");
      render();
    }catch(err){ alert("El archivo no es válido."); }
  };
  reader.readAsText(file);
  input.value = "";
}

function isUnlocked(unitId){
  if(unitId===1) return true;
  return !!(progress[unitId-1] && progress[unitId-1].completed);
}
function unitProgress(unitId){ return progress[unitId] || {completed:false,score:0}; }

/* ============== REPASO DIARIO DE VOCABULARIO ============== */
const LEITNER_DAYS = {1:0, 2:1, 3:3, 4:7, 5:14};
function allVocab(){
  const seen = new Set(); const list = [];
  UNITS.forEach(u => u.vocab.forEach(v => { if(!seen.has(v.en)){ seen.add(v.en); list.push(v); } }));
  return list;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function loadReview(){
  try{ return JSON.parse(localStorage.getItem("vocab_review")||"{}"); }catch(e){ return {}; }
}
function saveReview(rs){ try{ localStorage.setItem("vocab_review", JSON.stringify(rs)); }catch(e){} }
function getDueWords(){
  const rs = loadReview(); const today = todayStr(); const due = [];
  allVocab().forEach(v => {
    if(!rs[v.en]) rs[v.en] = { box:1, due: today };
    if(rs[v.en].due <= today) due.push(v);
  });
  saveReview(rs);
  return due;
}
let reviewQueue = [], reviewIndex = 0, reviewRevealed = false, reviewCorrectCount = 0;
function startReview(){
  reviewQueue = getDueWords().sort(()=>Math.random()-0.5).slice(0,20);
  reviewIndex = 0; reviewRevealed = false; reviewCorrectCount = 0;
  state.view = "review";
  render();
}
function revealReview(){ reviewRevealed = true; render(); }
function answerReview(known){
  const word = reviewQueue[reviewIndex];
  const rs = loadReview();
  const entry = rs[word.en] || {box:1, due:todayStr()};
  if(known){
    entry.box = Math.min(entry.box+1, 5);
    reviewCorrectCount++;
  } else {
    entry.box = 1;
  }
  const days = LEITNER_DAYS[entry.box] || 0;
  const d = new Date(); d.setDate(d.getDate()+days);
  entry.due = d.toISOString().slice(0,10);
  rs[word.en] = entry; saveReview(rs);
  reviewIndex++; reviewRevealed = false;
  render();
}

/* ============== VOZ ============== */
function getEnVoice(){
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.lang.startsWith("en-US")) ||
         voices.find(v => v.lang.startsWith("en")) ||
         null;
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const go = () => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.88;
    const v = getEnVoice(); if(v) u.voice = v;
    window.speechSynthesis.speak(u);
  };
  if(window.speechSynthesis.getVoices().length) go();
  else window.speechSynthesis.onvoiceschanged = go;
}
function playDialogue(unitId){
  const u = UNITS.find(x => x.id === unitId);
  if(!u) return;
  speakSequence(u.dialogue.map(d => d.en));
}
function speakSequence(lines, i=0){
  if(!('speechSynthesis' in window) || i>=lines.length) return;
  window.speechSynthesis.cancel();
  const go = () => {
    const u = new SpeechSynthesisUtterance(lines[i]);
    u.lang = "en-US"; u.rate = 0.88;
    const v = getEnVoice(); if(v) u.voice = v;
    // Keepalive: Android mata speechSynthesis en frases largas
    const keepAlive = setInterval(() => window.speechSynthesis.resume(), 10000);
    u.onend = () => { clearInterval(keepAlive); speakSequence(lines, i+1); };
    u.onerror = () => { clearInterval(keepAlive); speakSequence(lines, i+1); };
    window.speechSynthesis.speak(u);
  };
  if(window.speechSynthesis.getVoices().length) go();
  else window.speechSynthesis.onvoiceschanged = go;
}

function micSupported(){
  return ('SpeechRecognition' in window) || ('webkitSpeechRecognition' in window);
}
function cleanWord(s){ return s.toLowerCase().replace(/[^a-z0-9]/g,"").trim(); }
function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function wordsMatch(a,b){
  a=cleanWord(a); b=cleanWord(b);
  if(!a||!b) return false;
  if(a===b) return true;
  // Contracciones comunes
  const contractions={"im":"i am","ive":"i have","id":"i would","ill":"i will","its":"it is","youre":"you are","hes":"he is","shes":"she is","weve":"we have","theyre":"they are","dont":"do not","doesnt":"does not","didnt":"did not","cant":"cannot","wont":"will not","wouldnt":"would not","isnt":"is not","arent":"are not","havent":"have not","hasnt":"has not","hadnt":"had not","couldnt":"could not","shouldnt":"should not","mustnt":"must not","lets":"let us"};
  if(contractions[a]&&cleanWord(contractions[a])===b) return true;
  if(contractions[b]&&cleanWord(contractions[b])===a) return true;
  // Distancia de edición tolerante: 1 error por cada 5 letras
  const maxDist = Math.floor(Math.max(a.length,b.length)/5);
  return levenshtein(a,b) <= Math.max(1, maxDist);
}
// Artículos y palabras funcionales opcionales (el reconocedor a veces las omite)
const OPTIONAL_WORDS = new Set(["a","an","the","please","just","some","any","very","really","so","too","quite"]);
function wordDiff(target, heard){
  const tWords = target.toLowerCase().replace(/[^a-z0-9' ]/g,"").trim().split(/\s+/);
  const hWords = heard.toLowerCase().replace(/[^a-z0-9' ]/g,"").trim().split(/\s+/);
  // Alinear las palabras objetivo con las escuchadas (ignorar opcionales que falten)
  const result = [];
  let hi = 0;
  for(let ti=0; ti<tWords.length; ti++){
    const tw = tWords[ti];
    const hw = hWords[hi];
    if(hw && wordsMatch(tw, hw)){
      result.push({word:tw, ok:true}); hi++;
    } else if(OPTIONAL_WORDS.has(cleanWord(tw))){
      result.push({word:tw, ok:true}); // omitida pero opcional → ok
    } else if(hw && OPTIONAL_WORDS.has(cleanWord(hw))){
      hi++; ti--; // el usuario dijo una palabra extra opcional → ignorar
    } else {
      result.push({word:tw, ok:false});
    }
  }
  return result;
}
function overallOk(diff){ return diff.filter(d=>!OPTIONAL_WORDS.has(cleanWord(d.word))).every(d=>d.ok); }
function startRecording(phraseIdx, targetText){
  if(!micSupported()){
    showResult(phraseIdx, "⚠️ Tu navegador no soporta el micrófono para reconocimiento de voz. Prueba con Google Chrome.", false);
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = "en-US"; rec.maxAlternatives = 1;
  const btn = document.getElementById("mic-"+phraseIdx);
  if(btn){ btn.textContent = "🎙️ Escuchando…"; btn.disabled = true; }
  rec.onresult = (event) => {
    const heard = event.results[0][0].transcript;
    const diff = wordDiff(targetText, heard);
    const allOk = overallOk(diff);
    const wordsHtml = diff.map(d => `<span class="diffword ${d.ok?'ok':'bad'}">${d.word}</span>`).join(" ");
    const html = `<div>${allOk ? "✅ ¡Pronunciación correcta!" : "⚠️ Revisa estas palabras (en rojo):"}</div>
      <div style="margin-top:4px;">${wordsHtml}</div>
      <div style="margin-top:4px;color:var(--ink-soft);font-size:12px;">Escuchamos: "${heard}"</div>`;
    showResult(phraseIdx, html, allOk);
  };
  rec.onerror = (e) => { showResult(phraseIdx, "No se pudo escuchar bien. Acércate al micrófono e intenta de nuevo.", false); };
  rec.onend = () => { if(btn){ btn.textContent = "🎤 Grabar"; btn.disabled = false; } };
  rec.start();
}
function showResult(idx, html, ok){
  const box = document.getElementById("result-"+idx);
  if(!box) return;
  box.className = "result-box " + (ok ? "ok" : "bad");
  box.innerHTML = html;
}

let freeQueue = [], freeIndex = 0, freeInput = "", freeResult = null, freeMode = "write";

function allPhrases(){
  const list = [];
  UNITS.forEach(u => {
    (u.practice||[]).forEach(p => list.push({en:p.en, es:p.es, unit:u.title}));
    (u.dialogue||[]).forEach(d => list.push({en:d.en, es:d.es, unit:u.title}));
  });
  return list;
}
function startFree(){
  freeQueue = allPhrases().sort(()=>Math.random()-0.5).slice(0,30);
  freeIndex = 0; freeInput = ""; freeResult = null; freeMode = "write";
  state.view = "free";
  render();
}
function cleanStr(s){ return s.toLowerCase().replace(/[^a-z0-9 ']/g,"").trim(); }
function checkFreeWrite(){
  const target = freeQueue[freeIndex].en;
  const ok = cleanStr(freeInput) === cleanStr(target);
  freeResult = {ok, target, heard: freeInput};
  render();
}
function nextFree(){ freeIndex++; freeInput=""; freeResult=null; render(); }
function startFreeMic(){
  if(!micSupported()){ freeResult={ok:false,target:freeQueue[freeIndex].en,heard:"Micrófono no disponible en este navegador."}; render(); return; }
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  const rec = new SR(); rec.lang="en-US";
  const btn = document.getElementById("free-mic-btn");
  if(btn){ btn.textContent="🎙️ Escuchando…"; btn.disabled=true; }
  rec.onresult = e => {
    const heard = e.results[0][0].transcript;
    const target = freeQueue[freeIndex].en;
    const diff = wordDiff(target, heard);
    const ok = overallOk(diff);
    freeResult = {ok, target, heard, diff};
    render();
  };
  rec.onerror = () => { freeResult={ok:false,target:freeQueue[freeIndex].en,heard:"No se pudo escuchar. Intenta de nuevo."}; render(); };
  rec.onend = () => { if(btn){ btn.textContent="🎤 Hablar"; btn.disabled=false; } };
  rec.start();
}

  } else {

      <button class="btn" id="free-mic-btn" onclick="startFreeMic()">🎤 Hablar</button>
    </div>`;
  }

  let resultHtml = "";
  if(freeResult){
    if(freeResult.diff){
      const words = freeResult.diff.map(d=>`<span class="diffword ${d.ok?'ok':'bad'}">${d.word}</span>`).join(" ");
      resultHtml = `<div class="result-box ${freeResult.ok?'ok':'bad'}" style="display:block;margin-top:10px;">

        <small>Escuchamos: "${freeResult.heard}"</small></div>`;
    } else {
      resultHtml = `<div class="result-box ${freeResult.ok?'ok':'bad'}" style="display:block;margin-top:10px;">
        ${freeResult.ok?'✅ ¡Correcto!':'❌ Respuesta correcta: <strong>'+freeResult.target+'</strong>'}</div>`;
    }
  }

  return `
    <div class="unit-header"><span class="back-link" onclick="backToDashboard()">← Volver</span></div>
    <h2>🎲 Práctica libre</h2>
    <p style="color:var(--ink-soft);font-size:13px;">Frase ${freeIndex+1} de ${freeQueue.length} · De: ${item.unit}</p>
    <div class="panel">
      <div style="display:flex;gap:8px;margin-bottom:16px;">${modeTab("write","✍️ Escribir")}${modeTab("speak","🎤 Hablar")}</div>
      <div style="font-size:18px;font-weight:600;margin-bottom:6px;">¿Cómo se dice en inglés?</div>
      <div style="font-size:22px;color:var(--stamp-red);font-weight:700;margin-bottom:16px;">${item.es}</div>
      ${inputArea}

        <button class="btn" onclick="speak(${JSON.stringify(item.en)})">🔊 Escuchar correcto</button>
        <button class="btn" onclick="nextFree()">${freeIndex+1 < freeQueue.length ? 'Siguiente →' : 'Ver resultado'}</button>
      </div>` : ""}
    </div>`;

const PRONUNCIATION_TIPS = [
  {title:"El sonido \"TH\" (think, this)", tip:"No existe en español. Pon la punta de la lengua entre los dientes y deja salir el aire, sin que sea ni \"t\" ni \"d\" ni \"z\".",
   words:["think","this","three","mother","thank you"]},
  {title:"La \"H\" se pronuncia (a diferencia del español)", tip:"En español la H es muda. En inglés se pronuncia como un soplido de aire suave, parecido a una \"j\" muy débil.",
   words:["hello","house","happy","help","how"]},
  {title:"\"V\" vs \"B\"", tip:"En español suenan casi igual, pero en inglés son distintos: para la \"V\", el labio inferior toca los dientes de arriba (no se juntan los labios como en la B).",
   words:["very","berry","vacation","beautiful","video"]},
  {title:"Vocal corta \"I\" vs vocal larga \"EE\"", tip:"\"ship\" (barco) y \"sheep\" (oveja) suenan diferente: la \"I\" corta es más relajada y breve; la \"EE\" se alarga más.",
   words:["ship","sheep","sit","seat","big"]},
  {title:"Terminación \"-ed\" en el pasado", tip:"Se pronuncia distinto según la última letra del verbo: /t/ (worked), /d/ (played), o /id/ (wanted, needed).",
   words:["worked","played","wanted","needed","watched"]},
  {title:"No \"agregues\" vocales al final", tip:"En español tendemos a suavizar el final de las palabras. En inglés, las consonantes finales deben sonar claras y cortadas, sin vocal extra después.",
   words:["work","cat","stop","good","cold"]},
  {title:"Acento de la palabra (stress)", tip:"En inglés, la sílaba acentuada cambia mucho el sonido. Practica escuchando dónde cae el golpe de voz.",
   words:["photograph","photography","important","comfortable","interesting"]}
];

let listeningState = {};
function renderListening(u){
  if(!listeningState[u.id]) listeningState[u.id] = { revealedText:false, answers:{}, submitted:false };
  const ls = listeningState[u.id];
  const blocks = (u.listening||[]).map((q,qi) => {
    const opts = q.opts.map((opt,oi) => {
      let cls = "opt";
      if(ls.submitted){
        if(oi===q.correct) cls += " correct";
        else if(ls.answers[qi]===oi) cls += " incorrect";
      } else if(ls.answers[qi]===oi) cls += " selected";
      return `<label class="${cls}" onclick="${ls.submitted?'':`selectListeningAnswer(${u.id},${qi},${oi})`}">
        <input type="radio" name="lq${qi}" ${ls.answers[qi]===oi?'checked':''} ${ls.submitted?'disabled':''}/>${opt}
      </label>`;
    }).join("");
    const explain = ls.submitted ? `<p style="font-size:12px;color:var(--ink-soft);margin-top:4px;">${q.explain}</p>` : "";
    return `<div class="q-block"><div class="q-text">${qi+1}. ${q.q}</div>${opts}${explain}</div>`;
  }).join("");

  return `<h3>Comprensión auditiva 🎧</h3>
    <p style="color:var(--ink-soft);font-size:13px;">Escucha el audio (sin leer el texto) y responde. Puedes escucharlo varias veces antes de contestar.</p>
    <div class="btn-row">
      <button class="btn" onclick="playDialogue(${u.id})">🔊 Escuchar diálogo</button>
      <button class="btn ghost" onclick="toggleListeningText(${u.id})">${ls.revealedText ? "Ocultar texto" : "👀 Mostrar texto (si te trabas)"}</button>
    </div>
    ${ls.revealedText ? `<div style="margin-top:14px;">${u.dialogue.map(d=>`<div class="bubble ${d.sp}">${d.en}</div>`).join("")}</div>` : ""}
    <div style="margin-top:20px;">${blocks}</div>
    ${!ls.submitted
      ? `<div class="btn-row"><button class="btn" onclick="submitListening(${u.id})" ${Object.keys(ls.answers).length<(u.listening||[]).length?'disabled':''}>Comprobar respuestas</button></div>`
      : `<div class="btn-row"><button class="btn" onclick="setTab('practice')">Siguiente: Práctica oral →</button></div>`}
  `;
}
function selectListeningAnswer(unitId, qi, oi){ listeningState[unitId].answers[qi] = oi; render(); }
function submitListening(unitId){ listeningState[unitId].submitted = true; render(); }
function toggleListeningText(unitId){ listeningState[unitId].revealedText = !listeningState[unitId].revealedText; render(); }

function renderStory(u){
  const s = u.story;
  if(!u.storyState) u.storyState = {answers:{}, submitted:false};
  const ss = u.storyState;
  const blocks = s.questions.map((q,qi) => {
    const opts = q.opts.map((opt,oi) => {
      let cls = "opt";
      if(ss.submitted){ if(oi===q.correct) cls+=" correct"; else if(ss.answers[qi]===oi) cls+=" incorrect"; }
      else if(ss.answers[qi]===oi) cls+=" selected";
      return `<label class="${cls}" onclick="${ss.submitted?'':`selectStoryAnswer(${u.id},${qi},${oi})`}"><input type="radio" ${ss.answers[qi]===oi?'checked':''} ${ss.submitted?'disabled':''}/>${opt}</label>`;
    }).join("");
    const ex = ss.submitted ? `<p style="font-size:12px;color:var(--ink-soft);margin-top:4px;">${q.explain}</p>` : "";
    return `<div class="q-block"><div class="q-text">${qi+1}. ${q.q}</div>${opts}${ex}</div>`;
  }).join("");
  return `<h3>Historia 📖</h3>
    <p style="color:var(--ink-soft);font-size:13px;">Lee la historia y responde las preguntas. El vocabulario de esta unidad está en contexto real.</p>
    <div class="panel" style="background:var(--paper-dark);margin-bottom:16px;font-size:15px;line-height:1.7;">${s.text}</div>
    <button class="btn ghost" onclick="speak(${JSON.stringify(s.text)})">🔊 Escuchar historia</button>
    <div style="margin-top:18px;">${blocks}</div>
    ${!ss.submitted
      ? `<div class="btn-row"><button class="btn" onclick="submitStory(${u.id})" ${Object.keys(ss.answers).length<s.questions.length?'disabled':''}>Comprobar</button></div>`
      : `<div class="btn-row"><button class="btn" onclick="setTab('practice')">Siguiente: Práctica oral →</button></div>`}`;
}

function submitStory(uid){ const u=UNITS.find(x=>x.id===uid); u.storyState.submitted=true; render(); }

let rpState = {};
function renderRoleplay(u){
  if(!rpState[u.id]) rpState[u.id] = {step:0, correct:0, done:false, feedback:""};
  const rs = rpState[u.id];
  const rp = u.roleplay || [];
  if(rs.done || rs.step >= rp.length){
    const pct = Math.round((rs.correct/rp.length)*100);
    return `<h3>Role-play 🎭</h3>
      <div class="score-banner ${pct>=60?'pass':'fail'}">Resultado: ${rs.correct}/${rp.length} respuestas correctas (${pct}%)</div>
      <p>El role-play simula una conversación real. Elige la respuesta más natural y correcta en cada turno.</p>
      <div class="btn-row">
        <button class="btn secondary" onclick="resetRoleplay(${u.id})">🔁 Repetir role-play</button>
        <button class="btn" onclick="setTab('quiz')">Siguiente: Examen →</button>
      </div>`;
  }
  const step = rp[rs.step];
  const opts = step.options.map((opt,oi) =>
    `<button class="btn ghost" style="text-align:left;width:100%;margin-bottom:6px;" onclick="selectRoleplay(${u.id},${oi})">${opt}</button>`
  ).join("");
  const fb = rs.feedback ? `<div class="result-box ${rs.feedbackOk?'ok':'bad'}" style="display:block;">${rs.feedbackOk?'✅':'⚠️'} ${rs.feedback}</div>` : "";
  return `<h3>Role-play 🎭</h3>
    <p style="color:var(--ink-soft);font-size:13px;">Elige la respuesta más natural y correcta para cada situación. Paso ${rs.step+1} de ${rp.length}.</p>
    <div class="practice-card">
      <div class="practice-phrase" style="font-size:14px;margin-bottom:10px;">💬 ${step.prompt}</div>
      ${opts}
    </div>
    ${fb}`;
}
function selectRoleplay(uid, oi){
  if(!rpState[uid]) rpState[uid]={step:0,correct:0,done:false,feedback:""};
  const rs = rpState[uid];
  const u = UNITS.find(x=>x.id===uid);
  const step = u.roleplay[rs.step];
  const ok = oi === step.correct;
  rs.feedback = step.feedback || (ok ? "¡Correcto!" : `La respuesta correcta era: "${step.options[step.correct]}"`);
  rs.feedbackOk = ok;
  if(ok) rs.correct++;
  setTimeout(() => { rs.step++; rs.feedback=""; render(); }, 1800);
  render();
}
function resetRoleplay(uid){ rpState[uid]={step:0,correct:0,done:false,feedback:""}; render(); }

function renderErrors(u){
  const errs = (u.errors||[]).map((e,i) => `
    <div class="practice-card">
      <div style="color:var(--error);font-size:14px;margin-bottom:6px;">❌ ${e.wrong}</div>
      <div style="color:var(--stamp-green);font-size:14px;margin-bottom:6px;">✅ ${e.right}</div>
      <div style="font-size:13px;color:var(--ink-soft);">${e.explain}</div>
      <button class="btn ghost" style="margin-top:8px;" onclick="speak(${JSON.stringify(e.right.replace(/^This is actually correct!$/,''))})">🔊 Escuchar forma correcta</button>
    </div>`).join("");
  return `<h3>Errores comunes ⚠️</h3>
    <p style="color:var(--ink-soft);font-size:13px;">Estos son los errores más típicos de hispanohablantes en esta unidad. Estúdialos para no repetirlos.</p>
    ${errs}
    <div class="btn-row"><button class="btn" onclick="setTab('grammar')">Volver al inicio de la unidad</button></div>`;
}

function renderPractice(u){
  const warn = !micSupported() ? `<p style="color:var(--error);font-size:13px;">⚠️ Tu navegador no soporta grabación de voz. Puedes escuchar la pronunciación, pero la grabación funciona mejor en Google Chrome.</p>` : "";
  const cards = u.practice.map((p,i) => `
    <div class="practice-card">
      <div class="practice-phrase">${p.en}</div>
      <div class="practice-es">${p.es}</div>
      <div class="mic-row">
        <button class="btn ghost" onclick="speak('${p.en.replace(/'/g,"\\'")}')">🔊 Escuchar</button>
        <button class="btn" id="mic-${i}" onclick="startRecording(${i}, '${p.en.replace(/'/g,"\\'")}')">🎤 Grabar</button>
      </div>
      <div class="result-box" id="result-${i}"></div>
    </div>
  `).join("");
  return `<h3>Práctica oral</h3><p style="color:var(--ink-soft);font-size:13px;">Escucha la frase, luego grábate diciéndola en voz alta.</p>${warn}${cards}
    <div class="btn-row"><button class="btn" onclick="setTab('quiz')">Siguiente: Examen →</button></div>`;
}

let quizState = {};
function renderQuiz(u){
  if(!quizState[u.id]) quizState[u.id] = { answers:{}, submitted:false };
  const qs = quizState[u.id];
  const blocks = u.quiz.map((q,qi) => {
    const opts = q.opts.map((opt,oi) => {
      let cls = "opt";
      if(qs.submitted){
        if(oi===q.correct) cls += " correct";
        else if(qs.answers[qi]===oi) cls += " incorrect";
      } else if(qs.answers[qi]===oi) cls += " selected";
      return `<label class="${cls}" onclick="${qs.submitted?'':`selectAnswer(${u.id},${qi},${oi})`}">
        <input type="radio" name="q${qi}" ${qs.answers[qi]===oi?'checked':''} ${qs.submitted?'disabled':''}/>${opt}
      </label>`;
    }).join("");
    const explain = qs.submitted ? `<p style="font-size:12px;color:var(--ink-soft);margin-top:4px;">${q.explain}</p>` : "";
    return `<div class="q-block"><div class="q-text">${qi+1}. ${q.q}</div>${opts}${explain}</div>`;
  }).join("");

  let banner = "";
  let scoreActions = "";
  if(qs.submitted){
    const correct = u.quiz.filter((q,qi)=>qs.answers[qi]===q.correct).length;
    const score = Math.round((correct/u.quiz.length)*100);
    const passed = score >= 60;
    banner = `<div class="score-banner ${passed?'pass':'fail'}">${passed ? '🎉 ¡Aprobaste!' : '😕 No alcanzaste el mínimo'} — ${correct}/${u.quiz.length} correctas (${score}%)</div>`;
    scoreActions = `<div class="btn-row">
      ${passed ? `<button class="btn" onclick="completeUnit(${u.id},${score})">Guardar y continuar</button>` : `<button class="btn" onclick="retryQuiz(${u.id})">Reintentar examen</button>`}
      <button class="btn secondary" onclick="backToDashboard()">Volver al pasaporte</button>
    </div>`;
  }

  return `<h3>Examen</h3>${banner}${blocks}
    ${!qs.submitted ? `<div class="btn-row"><button class="btn" onclick="submitQuiz(${u.id})" ${Object.keys(qs.answers).length<u.quiz.length?'disabled':''}>Enviar respuestas</button></div>` : scoreActions}`;
}
function selectAnswer(unitId, qi, oi){
  quizState[unitId].answers[qi] = oi;
  render();
}
function submitQuiz(unitId){
  quizState[unitId].submitted = true;
  render();
}
function retryQuiz(unitId){
  quizState[unitId] = { answers:{}, submitted:false };
  render();
}
async function completeUnit(unitId, score){
  const prev = progress[unitId];
  progress[unitId] = { completed:true, score: Math.max(score, prev?prev.score:0) };
  await saveProgress();
  state.view = "dashboard";
  render();
}

/* ============== INICIO ============== */
loadProgress();
</script>
